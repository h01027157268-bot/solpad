name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    name: Anchor program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Unit tests (curve, fees, dividends, lottery)
        working-directory: programs/launchpad
        run: cargo test --lib
      - uses: metadaoproject/setup-anchor@v2
        with:
          anchor-version: '0.31.1'
          solana-cli-version: '2.1.0'
          node-version: '20'
      - name: Build program and IDL
        run: anchor build
      - name: Upload IDL
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl/launchpad.json
      - name: Anchor integration tests
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json
          anchor test

  app:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - name: Economics and market tests
        working-directory: app
        run: npm test
      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit
      - name: Build
        working-directory: app
        run: npm run build
